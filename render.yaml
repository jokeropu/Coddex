services:
  - type: web
    name: coddex-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: CLIENT_URL
        sync: false
      - key: DB_CONNECT_STRING
        sync: false
      - key: JWT_KEY
        sync: false
      - key: REDIS_PASS
        sync: false
      - key: JUDGE0_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: SENDER_GMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
